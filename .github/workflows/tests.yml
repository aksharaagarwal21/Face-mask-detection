name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (no TensorFlow)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install light dependencies
        run: pip install opencv-python-headless numpy scipy flask pytest
      - name: Run tests (model tests skip themselves)
        run: python -m pytest -q -rs

  model:
    name: Model tests (TensorFlow CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TensorFlow and inference dependencies
        run: pip install tensorflow-cpu opencv-python-headless scipy flask scikit-learn matplotlib pytest
      - name: Load the committed model, run inference and Grad-CAM
        run: python -m pytest -q -rs tests/test_model.py
